# FP4-relay-optimized tiny YOLO backbone for LegoGears (5 classes).
#
# Derived from yolov4-tiny.cfg's 2-head design, but the CSP route-splits and
# maxpool downsampling are replaced with a plain sequential bottleneck stack.
# Reason: Darknet's FP4 persistent-activation relay (see
# fp4_prepare_network_convolutions() / fp4_setup_convolutional_relay() in
# src-lib/darknet_network.cpp + src-lib/convolutional_layer.cpp) only links
# two PHYSICALLY ADJACENT [convolutional] layers, and only when the consumer
# is a plain direct 1x1 (groups=1, stride=1, pad=0, dilation=1). Any
# [route]/[shortcut]/[maxpool]/[upsample] between two convs breaks that
# adjacency, so CSP splits and residual adds -- while good for accuracy --
# are FP4-relay dead zones.
#
# Every stage below follows: conv3x3(stride2 downsample) -> conv1x1(reduce)
# -> conv1x1(project) -> conv3x3(spatial mix) -> conv1x1(reduce) ->
# conv1x1(project). Each "-> conv1x1" arrow is a relay-eligible boundary
# (producer can be 3x3 or 1x1; consumer must be the plain 1x1). Only the
# "1x1 -> 3x3" step and the route/upsample/concat merge points are not.
# That's the deliberate trade against yolov4-tiny's CSP/maxpool accuracy
# tricks, in exchange for dense, verifiable NVFP4 relay chains.
#
# Train/measure with -fp4 on a Blackwell GPU (see README_BLACKWELL_FP4.md);
# check fp4_relay_links / fp4_relay_gemms in run_precision_matrix.sh output
# to confirm how many of the ~19 marked boundaries actually link at runtime
# (cuBLASLt must also find a valid heuristic plan for the exact shapes).

[net]
# Testing
#batch=1
#subdivisions=1
# Training
batch=32
subdivisions=1
width=224
height=160
channels=3
momentum=0.9
decay=0.0005
angle=0
saturation=1.500000
exposure=1.500000
hue=0.100000

learning_rate=0.002610
burn_in=1000

max_batches=3000
policy=steps
steps=2400,2700
scales=0.2,0.1

# ============ Stem ============ #

# idx 0 -- 4x4 stem (not the usual 3x3): kernel = c*size*size = 3*4*4 = 48,
# divisible by 16, so this is the one layer that can be made FP4-shape-eligible
# at all (see fp4_gemm_plan_create()'s reduction%16 gate in src-fp4/fp4_gemm.cpp
# -- with c=3 fixed by RGB input, no odd kernel size ever satisfies this, since
# 3 is coprime with 16). Explicit padding=1 (NOT pad=1, which would force
# padding=size/2=2) keeps the output at exactly 112x80, matching what the 3x3
# stem produced, so every downstream layer is unaffected.
# NOTE: this changes the stem's weight tensor shape (3x3x3x32 -> 4x4x3x32).
# Darknet's .weights format is a flat sequential stream with no per-layer
# keys, so this invalidates loading yolov4-tiny-fp4_*.weights entirely, not
# just this layer -- retrain from scratch after this change.
[convolutional]
batch_normalize=1
filters=32
size=4
stride=2
padding=1
activation=leaky

# ============ Stage 1 (112x80 -> 56x40, 64ch) ============ #

# idx 1 -- downsample
[convolutional]
batch_normalize=1
filters=64
size=3
stride=2
pad=1
activation=leaky

# idx 2 -- relay(1->2): producer 3x3, consumer plain 1x1
[convolutional]
batch_normalize=1
filters=32
size=1
stride=1
pad=1
activation=leaky

# idx 3 -- relay(2->3): both plain 1x1
[convolutional]
batch_normalize=1
filters=64
size=1
stride=1
pad=1
activation=leaky

# idx 4 -- spatial mix (consumer of idx3, not relay-eligible: 3x3)
[convolutional]
batch_normalize=1
filters=64
size=3
stride=1
pad=1
activation=leaky

# idx 5 -- relay(4->5): producer 3x3, consumer plain 1x1
[convolutional]
batch_normalize=1
filters=32
size=1
stride=1
pad=1
activation=leaky

# idx 6 -- relay(5->6): both plain 1x1
[convolutional]
batch_normalize=1
filters=64
size=1
stride=1
pad=1
activation=leaky

# ============ Stage 2 (56x40 -> 28x20, 128ch) ============ #

# idx 7 -- downsample
[convolutional]
batch_normalize=1
filters=128
size=3
stride=2
pad=1
activation=leaky

# idx 8 -- relay(7->8)
[convolutional]
batch_normalize=1
filters=64
size=1
stride=1
pad=1
activation=leaky

# idx 9 -- relay(8->9)
[convolutional]
batch_normalize=1
filters=128
size=1
stride=1
pad=1
activation=leaky

# idx 10 -- spatial mix
[convolutional]
batch_normalize=1
filters=128
size=3
stride=1
pad=1
activation=leaky

# idx 11 -- relay(10->11)
[convolutional]
batch_normalize=1
filters=64
size=1
stride=1
pad=1
activation=leaky

# idx 12 -- relay(11->12)
[convolutional]
batch_normalize=1
filters=128
size=1
stride=1
pad=1
activation=leaky

# ============ Stage 3 (28x20 -> 14x10, 256ch) -- P4 tap ============ #

# idx 13 -- downsample
[convolutional]
batch_normalize=1
filters=256
size=3
stride=2
pad=1
activation=leaky

# idx 14 -- relay(13->14)
[convolutional]
batch_normalize=1
filters=128
size=1
stride=1
pad=1
activation=leaky

# idx 15 -- relay(14->15)
[convolutional]
batch_normalize=1
filters=256
size=1
stride=1
pad=1
activation=leaky

# idx 16 -- spatial mix
[convolutional]
batch_normalize=1
filters=256
size=3
stride=1
pad=1
activation=leaky

# idx 17 -- relay(16->17)
[convolutional]
batch_normalize=1
filters=128
size=1
stride=1
pad=1
activation=leaky

# idx 18 -- relay(17->18) -- P4 tap (14x10, 256ch), routed to by idx 32
[convolutional]
batch_normalize=1
filters=256
size=1
stride=1
pad=1
activation=leaky

# ============ Stage 4 (14x10 -> 7x5, 512ch) -- P5 / coarse scale ============ #

# idx 19 -- downsample
[convolutional]
batch_normalize=1
filters=512
size=3
stride=2
pad=1
activation=leaky

# idx 20 -- relay(19->20)
[convolutional]
batch_normalize=1
filters=256
size=1
stride=1
pad=1
activation=leaky

# idx 21 -- relay(20->21)
[convolutional]
batch_normalize=1
filters=512
size=1
stride=1
pad=1
activation=leaky

# idx 22 -- spatial mix
[convolutional]
batch_normalize=1
filters=512
size=3
stride=1
pad=1
activation=leaky

# idx 23 -- relay(22->23)
[convolutional]
batch_normalize=1
filters=256
size=1
stride=1
pad=1
activation=leaky

# idx 24 -- relay(23->24)
[convolutional]
batch_normalize=1
filters=512
size=1
stride=1
pad=1
activation=leaky

# ============ Head 1 (coarse, 7x5) ============ #

# idx 25 -- relay(24->25): both plain 1x1, also the branch point for idx 29's route
[convolutional]
batch_normalize=1
filters=256
size=1
stride=1
pad=1
activation=leaky

# idx 26 -- pre-detect spatial mix (consumer of idx25, not relay-eligible: 3x3)
[convolutional]
batch_normalize=1
filters=512
size=3
stride=1
pad=1
activation=leaky

# idx 27 -- relay(26->27): producer 3x3, consumer plain 1x1 detection conv
[convolutional]
size=1
stride=1
pad=1
filters=30
activation=linear

# idx 28
[yolo]
mask = 3,4,5
anchors = 8, 8, 10, 9, 14, 12, 41, 41, 48, 47, 73, 70
classes=5
num=6
jitter=.3
scale_x_y = 1.05
cls_normalizer=1.000000
iou_normalizer=0.750000
iou_loss=ciou
ignore_thresh = .7
truth_thresh = 1
random=0
resize=1.5
nms_kind=greedynms
beta_nms=0.6

# ============ Head 2 (fine, 14x10) ============ #

# idx 29 -- route back to idx 25's output (skip the head-1 detect triplet);
# not relay-eligible (producer is [route], not CONVOLUTIONAL)
[route]
layers = -4

# idx 30 -- compress before upsample
[convolutional]
batch_normalize=1
filters=128
size=1
stride=1
pad=1
activation=leaky

# idx 31
[upsample]
stride=2

# idx 32 -- bring in the P4 tap (idx 18); not relay-eligible (producer is [route])
[route]
layers = 18

# idx 33 -- project P4 tap down before concat
[convolutional]
batch_normalize=1
filters=64
size=1
stride=1
pad=1
activation=leaky

# idx 34 -- concat upsampled coarse features (idx 31, 128ch) with projected
# P4 tap (idx 33, 64ch) = 192ch; not relay-eligible (producer is [route])
[route]
layers = -1,-3

# idx 35 -- fuse concatenated channels (consumer of idx34/[route], not relay-eligible)
[convolutional]
batch_normalize=1
filters=96
size=1
stride=1
pad=1
activation=leaky

# idx 36 -- relay(35->36): both plain 1x1
[convolutional]
batch_normalize=1
filters=96
size=1
stride=1
pad=1
activation=leaky

# idx 37 -- pre-detect spatial mix (consumer of idx36, not relay-eligible: 3x3)
[convolutional]
batch_normalize=1
filters=192
size=3
stride=1
pad=1
activation=leaky

# idx 38 -- relay(37->38): producer 3x3, consumer plain 1x1 detection conv
[convolutional]
size=1
stride=1
pad=1
filters=30
activation=linear

# idx 39
[yolo]
mask = 0,1,2
anchors = 8, 8, 10, 9, 14, 12, 41, 41, 48, 47, 73, 70
classes=5
num=6
jitter=.3
scale_x_y = 1.05
cls_normalizer=1.000000
iou_normalizer=0.750000
iou_loss=ciou
ignore_thresh = .7
truth_thresh = 1
random=0
resize=1.5
nms_kind=greedynms
beta_nms=0.6
