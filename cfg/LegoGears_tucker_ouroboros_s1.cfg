# LegoGears — Tucker backbone + Ouroboros Stage 1 recursive block
# Base: LegoGears_tucker.cfg
# Change: Tucker #2 and #4 (both 512ch at 14x10) replaced by one [recursive_block]
#         with ouroboros=1 (FiLM+gate controller).  Body convs are sub-layers and do
#         not increment the outer layer index, so [route layers=-1,24] is unchanged.
#
# Layer index reference (outer network only):
#   ...
#   24: conv 256 1x1  (14x10)     ← route target in second YOLO neck
#   25: route -6,-1   (14x10 512ch)
#   26: conv 512 3x3
#   27: conv 512 1x1
#   28: [recursive_block] ouroboros=1  ← was tucker512 x2 (layers 28+29)
#   29: conv 512 stride=2 (14x10 -> 7x5)
#   30: conv 512 1x1
#   -- detection --
#   31: conv 256  \
#   32: conv 512   > large-scale head
#   33: conv 30   /
#   34: yolo (mask 3,4,5)
#   35: route -4 -> layer 31 (conv 256)
#   ...
#   38: route -1, 24  -> upsample + layer 24 (14x10 256ch)

[net]
batch=32
subdivisions=1
width=224
height=160
channels=3
momentum=0.92
decay=0.0005
angle=0
saturation=1.500000
exposure=1.500000
hue=0.100000
adam=0

learning_rate=0.002610
burn_in=1000

max_batches=3000
policy=steps
steps=2200,2600
scales=0.2,0.1
loss_scale=1.0
random_init_weights=0

cutmix=0
flip=0
max_chart_loss=4.000000
mixup=0
mosaic=0
use_cuda_graph=0
cudnn_bf16=0
cudnn_fp8=0

# ── Stem ────────────────────────────────────────────────────────────────────

[convolutional]
batch_normalize=1
filters=32
size=3
stride=2
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=64
size=3
stride=2
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=64
size=3
stride=1
pad=1
activation=leaky

[route]
layers=-1
groups=2
group_id=1

[convolutional]
batch_normalize=1
filters=32
size=3
stride=1
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=32
size=3
stride=1
pad=1
activation=leaky

[route]
layers = -1,-2

[convolutional]
batch_normalize=1
filters=64
size=1
stride=1
pad=1
activation=leaky

[route]
layers = -6,-1

[maxpool]
size=2
stride=2

# ── Stage 2: 28x20, 128→256 ch ──────────────────────────────────────────────

[convolutional]
batch_normalize=1
filters=128
size=3
stride=1
pad=1
activation=leaky

[route]
layers=-1
groups=2
group_id=1

[convolutional]
batch_normalize=1
filters=64
size=1
stride=1
pad=1
activation=leaky

[route]
layers = -1,-2

[convolutional]
batch_normalize=1
filters=128
size=1
stride=1
pad=1
activation=leaky

[route]
layers = -6,-1

# ── Tucker attention at 28x20 (unchanged) ───────────────────────────────────

[tucker_attention]
# MiniMax Sparse Attention: local block + Top-k key blocks
msa=1
msa_block=5
msa_topk=2
filters=256
size=5
heads=4
rank_q=32
rank_k=32
rank_v=32
rank_o=32
activation=linear

[tucker_attention]
# MiniMax Sparse Attention: local block + Top-k key blocks
msa=1
msa_block=7
msa_topk=2
filters=256
size=7
heads=4
rank_q=32
rank_k=32
rank_v=32
rank_o=32
activation=linear

[maxpool]
size=2
stride=2

# ── Stage 3: 14x10, 256→512 ch ──────────────────────────────────────────────

[convolutional]
batch_normalize=1
filters=256
size=1
stride=1
pad=1
activation=leaky

[route]
layers=-1
groups=2
group_id=1

[convolutional]
batch_normalize=1
filters=128
size=3
stride=1
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=128
size=3
stride=1
pad=1
activation=leaky

[route]
layers = -1,-2

# layer 24: conv 256 — referenced by second YOLO neck as "layers=-1, 24"
[convolutional]
batch_normalize=1
filters=256
size=1
stride=1
pad=1
activation=leaky

[route]
layers = -6,-1

[convolutional]
batch_normalize=1
filters=512
size=3
stride=1
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=512
size=1
stride=1
pad=1
activation=leaky

# ── Ouroboros Stage 1: 14x10, 512 ch ────────────────────────────────────────
# Replaces Tucker #2 + #4 (two 512-ch attention blocks).
# Body convs are internal sub-layers (not counted in outer network indices).
# batch_normalize=0 inside body: BN with shared weights across loops is unstable.

[recursive_block]
loops=4
body=2
injection=0
body_scale=1.0
residual_scale=0.0
injection_scale=0.0
ouroboros=1
gate_bias=-2.0
gamma_clip=4.0
gate_clip=30.0

[convolutional]
filters=512
size=3
stride=1
pad=1
batch_normalize=0
activation=leaky

[convolutional]
filters=512
size=3
stride=1
pad=1
batch_normalize=0
activation=leaky

# ── Stride-2 downsample: 14x10 -> 7x5 ───────────────────────────────────────

[convolutional]
batch_normalize=1
filters=512
size=3
stride=2
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=512
size=1
stride=1
pad=1
activation=leaky

# ── Detection head: large scale (7x5) ───────────────────────────────────────

[convolutional]
batch_normalize=1
filters=256
size=1
stride=1
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=512
size=3
stride=1
pad=1
activation=leaky

[convolutional]
size=1
stride=1
pad=1
filters=30
activation=linear

[yolo]
mask = 3,4,5
anchors=10, 10, 16, 14, 32, 23, 21, 98, 51, 50, 80, 78
classes=5
num=6
jitter=.3
scale_x_y = 1.05
cls_normalizer=1.0
iou_normalizer=0.07
iou_loss=ciou
ignore_thresh = .7
truth_thresh = 1
random=0
resize=1.5
nms_kind=greedynms
beta_nms=0.6

# ── Detection head: small scale (14x10) ─────────────────────────────────────

[route]
layers = -4

[convolutional]
batch_normalize=1
filters=128
size=1
stride=1
pad=1
activation=leaky

[upsample]
stride=2

[route]
layers = -1, 24

[convolutional]
batch_normalize=1
filters=384
size=1
stride=1
pad=1
activation=leaky

[convolutional]
size=1
stride=1
pad=1
filters=30
activation=linear

[yolo]
mask = 0,1,2
anchors=10, 10, 16, 14, 32, 23, 21, 98, 51, 50, 80, 78
classes=5
num=6
jitter=.3
scale_x_y = 1.05
cls_normalizer=1.0
iou_normalizer=0.07
iou_loss=ciou
ignore_thresh = .7
truth_thresh = 1
random=0
resize=1.5
nms_kind=greedynms
beta_nms=0.6
