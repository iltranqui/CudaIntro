# ============================================================================
# RF-DETR-lite on the LegoGears dataset (5 classes, 224x160 input).
# darknet's first query-based (DETR-style) detector.
#
# Architecture:
#   conv stem (downsample to a compact feature map / "memory")
#   -> tucker attention encoder (depth-stable; preferred over [vit])
#   -> [detr_decoder] : object queries cross-attend to memory and emit
#      one (class-logits, box) prediction each. Greedy-matched L1 + BCE loss.
#
# This is the v1 substrate from the RF-DETR plan: single cross-attention block,
# stop-gradient backbone, no NAS / DINOv2 / deformable-attn yet.
#
# Train:  darknet detector train LegoGears.data cfg/rfdetr-lite.cfg
# (uses the same LegoGears.data / images as LegoGears_centernet.cfg)
# ============================================================================

[net]
# Testing
#batch=1
#subdivisions=1
# Training
batch=32
subdivisions=1
width=224
height=160
channels=3
momentum=0.9
decay=0.0005
angle=0
saturation=1.5
exposure=1.5
hue=0.1
learning_rate=0.0001
burn_in=100
max_batches=20000
policy=steps
steps=16000,18000
scales=0.1,0.1

# ---- conv stem : 224x160 -> 14x10, 128 channels (140 memory tokens) ----
[convolutional]
batch_normalize=1
filters=32
size=3
stride=2
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=64
size=3
stride=2
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=128
size=3
stride=2
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=128
size=3
stride=2
pad=1
activation=leaky

# ---- tucker attention encoder (channel-preserving, depth-stable) ----
[tucker]
filters=128
size=4
heads=4
rank=32
activation=linear

[tucker]
filters=128
size=4
heads=4
rank=32
activation=linear

# ---- DETR decoder head ----
[detr_decoder]
queries=50
classes=5
heads=8
ffn=256
max_boxes=200
cls_weight=1.0
l1_weight=5.0
giou_weight=2.0
