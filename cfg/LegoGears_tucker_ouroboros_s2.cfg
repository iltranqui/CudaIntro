# LegoGears — Tucker backbone + Ouroboros Stage 2 Conv-LoRA recursive block
# Training mode: FROM SCRATCH (lora_freeze_base=0, random_init_weights=1)
#
# Stage 2 wraps each eligible body conv with a dynamic low-rank branch:
#   y = activation( Conv_base(x) + (lora_alpha/lora_rank) * Conv_B( diag_t * Conv_A(x) ) )
# diag_t comes from the same FiLM/gate controller (GAP(hidden) + step_scalar).
# Controller now emits: [gamma * max_c] [gate * max_c] [diag * lora_adapters * lora_rank]
#
# lora_freeze_base=0: base + adapters + controller all train from random init.
# lora_diag_init=0.0: adapter contribution starts near zero so early training
#   behaves like a plain conv; adapters grow in gradually as the base stabilises.
#
# ============================================================
# TRAINING RECIPE
# ============================================================
#
# OPTION A — from scratch (this file as-is)
# -----------------------------------------
#   ./darknet detector train data/LegoGears.data \
#       cfg/LegoGears_tucker_ouroboros_s2.cfg
#
#   Key settings active: lora_freeze_base=0, lora_diag_init=0.0, random_init_weights=1
#   All weights (base body + Conv_A + Conv_B + controller) train jointly from random init.
#   lora_diag_init=0.0 keeps adapter output ~0 early so base conv dominates at first.
#
# OPTION B — from Stage 1 checkpoint (recommended for best mAP)
# -------------------------------------------------------------
#   Step 1: train Stage 1 first:
#     ./darknet detector train data/LegoGears.data \
#         cfg/LegoGears_tucker_ouroboros_s1.cfg
#
#   Step 2: fine-tune adapters only (edit this file):
#     lora_freeze_base=1   <- freeze base, train Conv_A + Conv_B + controller only
#     lora_diag_init=1.0   <- adapters active from step 1 (base already trained)
#     random_init_weights=0
#     learning_rate=0.001
#     burn_in=500
#     max_batches=1500
#     Then run:
#     ./darknet detector train data/LegoGears.data \
#         cfg/LegoGears_tucker_ouroboros_s2.cfg \
#         weights/LegoGears_tucker_ouroboros_s1_best.weights
#
#   Step 3 (optional) — joint fine-tune:
#     lora_freeze_base=0
#     learning_rate=0.0001
#     burn_in=100
#     max_batches=500
#     ./darknet detector train data/LegoGears.data \
#         cfg/LegoGears_tucker_ouroboros_s2.cfg \
#         weights/LegoGears_tucker_ouroboros_s2_best.weights
#
# NaN SURVIVAL CHECKLIST
# ----------------------
#   1. Halve learning_rate
#   2. Tighten clips: gamma_clip=2.0  gate_clip=20.0  lora_diag_clip=2.0
#   3. Reduce loops=2, confirm stable, then increase
#   4. Confirm batch_normalize=0 in both body convs (BN + shared weights = NaN)
#
# LAYER INDEX REFERENCE (outer network, 0-based)
# -----------------------------------------------
#   24: conv 256 1x1  (14x10)     <- route target in second YOLO neck
#   28: [recursive_block] ouroboros=2  (14x10, 512ch, 6 loops, 2 body convs)
#   29: conv 512 stride=2 (14x10 -> 7x5)
#   30: conv 512 1x1
#   31: conv 256   \
#   32: conv 512    > large-scale detection head
#   33: conv 30    /
#   34: yolo (mask 3,4,5)
#   35: route -4 -> layer 31 (conv 256)
#   38: route -1, 24  -> upsample + layer 24 (14x10 256ch)
# ============================================================

[net]
batch=32
subdivisions=1
width=224
height=160
channels=3
momentum=0.92
decay=0.0005
angle=0
saturation=1.500000
exposure=1.500000
hue=0.100000
adam=0

learning_rate=0.002610
burn_in=1000

max_batches=3000
policy=steps
steps=2200,2600
scales=0.2,0.1
loss_scale=1.0
random_init_weights=1

cutmix=0
flip=0
max_chart_loss=4.000000
mixup=0
mosaic=0
use_cuda_graph=0
cudnn_bf16=0
cudnn_fp8=0

# ── Stem ────────────────────────────────────────────────────────────────────

[convolutional]
batch_normalize=1
filters=32
size=3
stride=2
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=64
size=3
stride=2
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=64
size=3
stride=1
pad=1
activation=leaky

[route]
layers=-1
groups=2
group_id=1

[convolutional]
batch_normalize=1
filters=32
size=3
stride=1
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=32
size=3
stride=1
pad=1
activation=leaky

[route]
layers = -1,-2

[convolutional]
batch_normalize=1
filters=64
size=1
stride=1
pad=1
activation=leaky

[route]
layers = -6,-1

[maxpool]
size=2
stride=2

# ── Stage 2: 28x20, 128→256 ch ──────────────────────────────────────────────

[convolutional]
batch_normalize=1
filters=128
size=3
stride=1
pad=1
activation=leaky

[route]
layers=-1
groups=2
group_id=1

[convolutional]
batch_normalize=1
filters=64
size=1
stride=1
pad=1
activation=leaky

[route]
layers = -1,-2

[convolutional]
batch_normalize=1
filters=128
size=1
stride=1
pad=1
activation=leaky

[route]
layers = -6,-1

# ── Tucker attention at 28x20 (unchanged) ───────────────────────────────────

[tucker_attention]
# MiniMax Sparse Attention: local block + Top-k key blocks
msa=1
msa_block=5
msa_topk=2
filters=256
size=5
heads=4
rank_q=32
rank_k=32
rank_v=32
rank_o=32
activation=linear

[tucker_attention]
# MiniMax Sparse Attention: local block + Top-k key blocks
msa=1
msa_block=7
msa_topk=2
filters=256
size=7
heads=4
rank_q=32
rank_k=32
rank_v=32
rank_o=32
activation=linear

[maxpool]
size=2
stride=2

# ── Stage 3: 14x10, 256→512 ch ──────────────────────────────────────────────

[convolutional]
batch_normalize=1
filters=256
size=1
stride=1
pad=1
activation=leaky

[route]
layers=-1
groups=2
group_id=1

[convolutional]
batch_normalize=1
filters=128
size=3
stride=1
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=128
size=3
stride=1
pad=1
activation=leaky

[route]
layers = -1,-2

# layer 24: conv 256 — referenced by second YOLO neck as "layers=-1, 24"
[convolutional]
batch_normalize=1
filters=256
size=1
stride=1
pad=1
activation=leaky

[route]
layers = -6,-1

[convolutional]
batch_normalize=1
filters=512
size=3
stride=1
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=512
size=1
stride=1
pad=1
activation=leaky

# ── Ouroboros Stage 2: 14x10, 512 ch ────────────────────────────────────────
# ouroboros=2: FiLM/gate controller + Conv-LoRA adapters on both body convs.
# lora_freeze_base=0: all weights train (scratch mode). Set to 1 when loading S1 weights.
# batch_normalize=0 in body: BN statistics are per-pass but weights are shared.
# groups=1 required for LoRA wrapping (groups != 1 is skipped automatically).

[recursive_block]
loops=6
body=2
injection=0
body_scale=1.0
residual_scale=0.0
injection_scale=0.0
ouroboros=2
lora_rank=16
lora_alpha=16
lora_freeze_base=0
lora_diag_init=0.0
lora_diag_clip=4.0
gate_bias=-2.0
gamma_clip=4.0
gate_clip=30.0

[convolutional]
filters=512
size=3
stride=1
pad=1
batch_normalize=0
activation=leaky

[convolutional]
filters=512
size=3
stride=1
pad=1
batch_normalize=0
activation=leaky

# ── Stride-2 downsample: 14x10 -> 7x5 ───────────────────────────────────────

[convolutional]
batch_normalize=1
filters=512
size=3
stride=2
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=512
size=1
stride=1
pad=1
activation=leaky

# ── Detection head: large scale (7x5) ───────────────────────────────────────

[convolutional]
batch_normalize=1
filters=256
size=1
stride=1
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=512
size=3
stride=1
pad=1
activation=leaky

[convolutional]
size=1
stride=1
pad=1
filters=30
activation=linear

[yolo]
mask = 3,4,5
anchors=10, 10, 16, 14, 32, 23, 21, 98, 51, 50, 80, 78
classes=5
num=6
jitter=.3
scale_x_y = 1.05
cls_normalizer=1.0
iou_normalizer=0.07
iou_loss=ciou
ignore_thresh = .7
truth_thresh = 1
random=0
resize=1.5
nms_kind=greedynms
beta_nms=0.6

# ── Detection head: small scale (14x10) ─────────────────────────────────────

[route]
layers = -4

[convolutional]
batch_normalize=1
filters=128
size=1
stride=1
pad=1
activation=leaky

[upsample]
stride=2

[route]
layers = -1, 24

[convolutional]
batch_normalize=1
filters=384
size=1
stride=1
pad=1
activation=leaky

[convolutional]
size=1
stride=1
pad=1
filters=30
activation=linear

[yolo]
mask = 0,1,2
anchors=10, 10, 16, 14, 32, 23, 21, 98, 51, 50, 80, 78
classes=5
num=6
jitter=.3
scale_x_y = 1.05
cls_normalizer=1.0
iou_normalizer=0.07
iou_loss=ciou
ignore_thresh = .7
truth_thresh = 1
random=0
resize=1.5
nms_kind=greedynms
beta_nms=0.6
