# LegoGears with Tucker Attention (parallel to LegoGears_vit.cfg)
# Identical backbone + head as LegoGears_vit.cfg.
# Only difference: [vit] swapped for [tucker_attention] at the same slot
# (stride-8, 28x20, 128 channels). Route 23 unchanged.

[net]
batch=32
subdivisions=1
width=224
height=160
channels=3
momentum=0.92
decay=0.0005
angle=0
saturation=1.500000
exposure=1.500000
hue=0.100000
adam=0

learning_rate=0.002610
burn_in=1000

max_batches=3000
policy=steps
steps=2200,2600
scales=0.2,0.1
loss_scale=1.0
random_init_weights=0

cutmix=0
flip=0
max_chart_loss=4.000000
mixup=0
mosaic=0
use_cuda_graph=0
cudnn_bf16=0
cudnn_fp8=0

[convolutional]
batch_normalize=1
filters=32
size=3
stride=2
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=64
size=3
stride=2
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=64
size=3
stride=1
pad=1
activation=leaky

[route]
layers=-1
groups=2
group_id=1

[convolutional]
batch_normalize=1
filters=32
size=3
stride=1
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=32
size=3
stride=1
pad=1
activation=leaky

[route]
layers = -1,-2

[convolutional]
batch_normalize=1
filters=64
size=1
stride=1
pad=1
activation=leaky

[route]
layers = -6,-1

[maxpool]
size=2
stride=2

[convolutional]
batch_normalize=1
filters=128
size=3
stride=1
pad=1
activation=leaky

[route]
layers=-1
groups=2
group_id=1

[convolutional]
batch_normalize=1
filters=64
size=1
stride=1
pad=1
activation=leaky

[route]
layers = -1,-2

[convolutional]
batch_normalize=1
filters=128
size=1
stride=1
pad=1
activation=leaky

[route]
layers = -6,-1

# ── Tucker #1 at HIGHER level: 28x20, 256 ch, size=5 ────────────────────────
[tucker_attention]
filters=256
size=5
heads=4
rank_q=32
rank_k=32
rank_v=32
rank_o=32
activation=linear

# ── Tucker #3 stacked: 28x20, 256 ch, size=7 (bigger window) ────────────────
[tucker_attention]
filters=256
size=7
heads=4
rank_q=32
rank_k=32
rank_v=32
rank_o=32
activation=linear

[maxpool]
size=2
stride=2

[convolutional]
batch_normalize=1
filters=256
size=1
stride=1
pad=1
activation=leaky

[route]
layers=-1
groups=2
group_id=1

[convolutional]
batch_normalize=1
filters=128
size=3
stride=1
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=128
size=3
stride=1
pad=1
activation=leaky

[route]
layers = -1,-2

[convolutional]
batch_normalize=1
filters=256
size=1
stride=1
pad=1
activation=leaky

[route]
layers = -6,-1

[convolutional]
batch_normalize=1
filters=512
size=3
stride=1
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=512
size=1
stride=1
pad=1
activation=leaky

# ── Tucker #2 at DEEP slot: 14x10, 512 ch, size=5 ──────────────────────────
[tucker_attention]
filters=512
size=5
heads=8
rank_q=64
rank_k=64
rank_v=64
rank_o=64
activation=linear

# ── Tucker #4 stacked: 14x10, 512 ch, size=7 (bigger window) ────────────────
[tucker_attention]
filters=512
size=7
heads=8
rank_q=64
rank_k=64
rank_v=64
rank_o=64
activation=linear

# stride-2 conv (14x10 -> 7x5)
[convolutional]
batch_normalize=1
filters=512
size=3
stride=2
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=512
size=1
stride=1
pad=1
activation=leaky

