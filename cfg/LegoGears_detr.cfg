# DETR-style query detector on the LegoGears dataset.
# Named to match the LegoGears cfg family; architecturally this is the
# RF-DETR-lite substrate: compact conv/Tucker encoder + one [detr_decoder] head.
#
# Train: darknet detector train LegoGears.data cfg/LegoGears_detr.cfg

[net]
# Testing
#batch=1
#subdivisions=1
# Training
batch=8
subdivisions=1
width=224
height=160
channels=3
momentum=0.9
decay=0.0005
angle=0
saturation=1.5
exposure=1.5
hue=0.1
learning_rate=0.0001
burn_in=1000
max_batches=20000
policy=steps
steps=16000,18000
scales=0.1,0.1
random_init_weights=0
cutmix=0
flip=0
max_chart_loss=4.0
mixup=0
mosaic=0
use_cuda_graph=0

# Conv stem: 224x160 -> 14x10, 128 channels (140 memory tokens).
[convolutional]
batch_normalize=1
filters=32
size=3
stride=2
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=64
size=3
stride=2
pad=1
